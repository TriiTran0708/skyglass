<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · SkyGlass</title>
  <meta name="description" content="Tạo tài khoản SkyGlass.">
  <meta name="theme-color" content="#2f8fd8">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="forms.js" defer></script>
</head>
<body data-page="register">
  <div class="scene scene--register" aria-hidden="true"></div>
  <div class="bubbles" aria-hidden="true"></div>

  <main class="auth">
    <a class="brand-top" href="index.html" aria-label="SkyGlass — trang khởi động">
      <img src="assets/images/logo.svg" alt="" width="64" height="64">
      <span>SkyGlass</span>
      <small>Bright. Clear. Connected.</small>
    </a>

    <section class="vista-window auth-window" aria-labelledby="authTitle">
      <div class="titlebar">
        <img class="tb-icon" src="assets/images/logo.svg" alt="" width="18" height="18">
        <span class="tb-title">SkyGlass — Create account</span>
      </div>
      <div class="win-body win-body--solid">
        <h1 class="auth-title" id="authTitle">Create your account</h1>
        <p class="auth-sub">Chỉ mất một phút để bước vào thế giới Aero.</p>

        <div id="backendNotice" class="notice" role="note" hidden>
          <strong>Chưa cấu hình backend.</strong> <span></span> Đăng ký chưa hoạt động thực tế cho tới khi cấu hình xong.
        </div>

        <form id="authForm" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input class="input" id="username" name="username" type="text" autocomplete="username" placeholder="vd: sky_walker" maxlength="20" aria-describedby="username-error" required>
            <p class="field-error" id="username-error"></p>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="ban@example.com" aria-describedby="email-error" required>
            <p class="field-error" id="email-error"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input class="input input--pw" id="password" name="password" type="password" autocomplete="new-password" placeholder="Ít nhất 8 ký tự, có chữ và số" aria-describedby="password-error password-meter" required>
              <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Hiện mật khẩu" aria-pressed="false">
                <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.5 0-10-7-10-7a17.7 17.7 0 0 1 4.1-4.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17.8 17.8 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1A3 3 0 1 1 9.9 9.9"/></svg>
              </button>
            </div>
            <div class="meter" id="password-meter" data-meter-for="password" data-score="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
            <p class="meter-label" aria-live="polite"></p>
            <p class="field-error" id="password-error"></p>
          </div>

          <div class="field">
            <label for="confirm">Confirm Password</label>
            <div class="input-wrap">
              <input class="input input--pw" id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" aria-describedby="confirm-error" required>
              <button type="button" class="pw-toggle" data-toggle-password="confirm" aria-label="Hiện mật khẩu" aria-pressed="false">
                <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.5 0-10-7-10-7a17.7 17.7 0 0 1 4.1-4.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17.8 17.8 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1A3 3 0 1 1 9.9 9.9"/></svg>
              </button>
            </div>
            <p class="field-error" id="confirm-error"></p>
          </div>

          <div class="field">
            <label class="check"><input type="checkbox" id="terms" aria-describedby="terms-error"><span class="box"></span>Tôi đồng ý với điều khoản sử dụng</label>
            <p class="field-error" id="terms-error"></p>
          </div>

          <div id="formStatus" class="status" role="status" aria-live="polite"></div>

          <button class="btn btn--green btn--block btn--lg" type="submit" id="submitBtn"><span class="btn-label">Create Account</span></button>
        </form>

        <p class="auth-foot">Đã có tài khoản? <a href="login.html">Back to Login</a></p>
      </div>
    </section>

    <p class="auth-copy">© <span data-year></span> SkyGlass</p>
  </main>
</body>
</html>
