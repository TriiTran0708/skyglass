      <stop offset=".65" stop-color="#3aaee8" stop-opacity=".6"/><stop offset="1" stop-color="#0b5fb0" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="bub" cx=".35" cy=".3" r=".75">
