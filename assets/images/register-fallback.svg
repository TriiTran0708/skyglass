  </g>
  <rect y="470" width="1600" height="150" fill="url(#sea)"/>
  <rect y="455" width="1600" height="30" fill="#effcff" opacity=".6" filter="url(#blur)"/>
  <path d="M0 520 Q300 440 640 500 T1280 470 T1600 500 V900 H0Z" fill="url(#h1)"/>
  <path d="M0 640 Q260 560 560 620 T1160 600 T1600 640 V900 H0Z" fill="url(#h2)"/>
  <path d="M0 780 Q300 700 700 760 T1600 740 V900 H0Z" fill="#2c9a3c"/>
  <g fill="#fff" opacity=".5">
