  <circle cx="1330" cy="560" r="120" fill="url(#orb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="210" cy="520" r="64" fill="url(#orb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <g>
    <circle cx="1460" cy="380" r="30" fill="url(#bub)" stroke="#fff" stroke-opacity=".7"/>
    <circle cx="140" cy="360" r="22" fill="url(#bub)" stroke="#fff" stroke-opacity=".7"/>
    <circle cx="1190" cy="430" r="16" fill="url(#bub)" stroke="#fff" stroke-opacity=".6"/>
    <circle cx="360" cy="430" r="14" fill="url(#bub)" stroke="#fff" stroke-opacity=".6"/>
