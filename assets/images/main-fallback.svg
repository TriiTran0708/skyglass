<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f66b8"/><stop offset=".4" stop-color="#4fb0ea"/><stop offset=".75" stop-color="#bfeaff"/><stop offset="1" stop-color="#eefbff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ae9f0"/><stop offset=".5" stop-color="#2eaedb"/><stop offset="1" stop-color="#0d6db1"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93ea6c"/><stop offset="1" stop-color="#3aab48"/>
    </linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd058"/><stop offset="1" stop-color="#1c8638"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#fffbe0" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".28" r=".85">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".25" stop-color="#c4f3ff" stop-opacity=".6"/>
      <stop offset=".65" stop-color="#3aaee8" stop-opacity=".6"/><stop offset="1" stop-color="#0b5fb0" stop-opacity=".85"/>
    </radialGradient>
    <radialGradient id="bub" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".3" stop-color="#fff" stop-opacity=".15"/>
      <stop offset=".8" stop-color="#9fe6ff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".75"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
