    <polygon points="1500,330 1380,1080 1560,1080" fill="url(#ray)"/>
    <polygon points="1500,330 1700,1080 1900,1080" fill="url(#ray)"/>
  </g>
  <g fill="#fff" filter="url(#blur)" opacity=".95">
