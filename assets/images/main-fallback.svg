    <ellipse cx="420" cy="680" rx="260" ry="4"/><ellipse cx="820" cy="740" rx="320" ry="5"/><ellipse cx="1100" cy="800" rx="260" ry="4"/>
  </g>
  <path d="M0 760 Q320 670 700 740 T1400 720 T1920 750 V1080 H0Z" fill="url(#h1)"/>
  <path d="M0 850 Q300 780 640 830 T1300 810 T1920 840 V1080 H0Z" fill="url(#h2)"/>
  <path d="M0 960 Q360 900 760 950 T1920 930 V1080 H0Z" fill="#26883a"/>
  <g fill="#fff" opacity=".5">
