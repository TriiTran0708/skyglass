    <ellipse cx="1000" cy="150" rx="280" ry="52"/><ellipse cx="1140" cy="115" rx="170" ry="56"/>
    <ellipse cx="1700" cy="170" rx="220" ry="46"/>
    <ellipse cx="760" cy="400" rx="300" ry="40" opacity=".7"/><ellipse cx="1500" cy="520" rx="320" ry="36" opacity=".8"/>
