  </g>
  <circle cx="1520" cy="800" r="150" fill="url(#orb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="1730" cy="900" r="74" fill="url(#orb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="230" cy="860" r="96" fill="url(#orb)" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <g>
