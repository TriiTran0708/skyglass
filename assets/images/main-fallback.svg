    <circle cx="1240" cy="520" r="24" fill="url(#bub)" stroke="#fff" stroke-opacity=".7"/>
    <circle cx="120" cy="620" r="28" fill="url(#bub)" stroke="#fff" stroke-opacity=".7"/>
    <circle cx="1830" cy="600" r="30" fill="url(#bub)" stroke="#fff" stroke-opacity=".7"/>
    <circle cx="860" cy="470" r="14" fill="url(#bub)" stroke="#fff" stroke-opacity=".6"/>
