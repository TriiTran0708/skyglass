<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyGlass</title>
  <meta name="description" content="SkyGlass — Nostalgic Frutiger Aero × Liquid Glass × Windows Vista Aero.">
  <meta name="theme-color" content="#2f8fd8">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <style>
    .boot-bar { height: 14px; border-radius: 999px; overflow: hidden; border: 1px solid rgba(20, 90, 160, 0.6); background: linear-gradient(180deg, #cfe6f7, #f1f9ff); box-shadow: inset 0 2px 3px rgba(10, 70, 120, 0.25); }
    .boot-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(180deg, #b6f58f, #4fc15a 50%, #2f9a3f 52%, #7fe07a); box-shadow: 0 0 10px rgba(100, 220, 120, 0.8); animation: boot 1.1s var(--ease) forwards; }
    @keyframes boot { to { width: 100%; } }
    .boot-links { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body data-page="index">
  <div class="scene scene--login" aria-hidden="true"></div>
  <div class="bubbles" aria-hidden="true"></div>

  <main class="auth">
    <section class="vista-window auth-window" aria-labelledby="bootTitle">
      <div class="titlebar">
        <img class="tb-icon" src="assets/images/logo.svg" alt="" width="18" height="18">
        <span class="tb-title">SkyGlass</span>
      </div>
      <div class="win-body win-body--solid" style="text-align:center">
        <img src="assets/images/logo.svg" alt="" width="84" height="84">
        <h1 class="auth-title" id="bootTitle" style="margin-top:.4rem">SkyGlass</h1>
        <p class="auth-sub" id="bootText" role="status">Đang khởi động…</p>
        <div class="boot-bar" aria-hidden="true"><i></i></div>
        <div class="boot-links">
          <a class="btn btn--sm" href="login.html"><span class="btn-label">Login</span></a>
          <a class="btn btn--sm btn--green" href="register.html"><span class="btn-label">Register</span></a>
          <a class="btn btn--sm btn--glass" href="main.html"><span class="btn-label">Main Page</span></a>
        </div>
        <noscript><p class="status status--error">Trang này cần JavaScript để hoạt động.</p></noscript>
      </div>
    </section>
  </main>

  <script>
    // Chuyển tới Main nếu đã có phiên đăng nhập, ngược lại tới Login.
    window.addEventListener('DOMContentLoaded', async () => {
      const wait = window.UI && window.UI.reduceMotion ? 150 : 1100;
      const started = Date.now();
      let target = 'login.html';
      try {
        if (window.Auth && window.Auth.configured && (await window.Auth.getUser())) target = 'main.html';
      } catch { /* dùng mặc định */ }
      const text = document.getElementById('bootText');
      if (text) text.textContent = target === 'main.html' ? 'Đã tìm thấy phiên đăng nhập…' : 'Chuẩn bị trang đăng nhập…';
      setTimeout(() => window.UI.go(target), Math.max(0, wait - (Date.now() - started)));
    });
  </script>
</body>
</html>
