<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · SkyGlass</title>
  <meta name="description" content="Đăng nhập vào SkyGlass — không gian Aero trong veo.">
  <meta name="theme-color" content="#2f8fd8">
  <link rel="icon" href="assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="forms.js" defer></script>
</head>
<body data-page="login">
  <div class="scene scene--login" aria-hidden="true"></div>
  <div class="bubbles" aria-hidden="true"></div>

  <main class="auth">
    <a class="brand-top" href="index.html" aria-label="SkyGlass — trang khởi động">
      <img src="assets/images/logo.svg" alt="" width="64" height="64">
      <span>SkyGlass</span>
      <small>Bright. Clear. Connected.</small>
    </a>

    <section class="vista-window auth-window" aria-labelledby="authTitle">
      <div class="titlebar">
        <img class="tb-icon" src="assets/images/logo.svg" alt="" width="18" height="18">
        <span class="tb-title">SkyGlass — Sign in</span>
      </div>
      <div class="win-body win-body--solid">
        <h1 class="auth-title" id="authTitle">Welcome back</h1>
        <p class="auth-sub">Đăng nhập để vào không gian Aero của bạn.</p>

        <div id="backendNotice" class="notice" role="note" hidden>
          <strong>Chưa cấu hình backend.</strong> <span></span> Đăng nhập chưa hoạt động thực tế cho tới khi cấu hình xong.
        </div>

        <form id="authForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="username" inputmode="email" placeholder="ban@example.com" aria-describedby="email-error" required>
            <p class="field-error" id="email-error"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input class="input input--pw" id="password" name="password" type="password" autocomplete="current-password" placeholder="Mật khẩu của bạn" aria-describedby="password-error" required>
              <button type="button" class="pw-toggle" data-toggle-password="password" aria-label="Hiện mật khẩu" aria-pressed="false">
                <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.5 0-10-7-10-7a17.7 17.7 0 0 1 4.1-4.9M9.9 5.2A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a17.8 17.8 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1A3 3 0 1 1 9.9 9.9"/></svg>
              </button>
            </div>
            <p class="field-error" id="password-error"></p>
          </div>

          <div class="row-between">
            <label class="check"><input type="checkbox" id="remember"><span class="box"></span>Remember me</label>
            <button type="button" class="link-btn" id="forgotBtn">Forgot password?</button>
          </div>

          <div id="formStatus" class="status" role="status" aria-live="polite"></div>

          <button class="btn btn--block" type="submit" id="submitBtn"><span class="btn-label">Login</span></button>

          <div class="divider"><span>hoặc</span></div>

          <button class="btn btn--glass btn--block" type="button" id="googleBtn">
            <span class="btn-label">
              <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
              Continue with Google
            </span>
          </button>
        </form>

        <p class="auth-foot">Chưa có tài khoản? <a href="register.html">Create an account</a></p>
      </div>
    </section>

    <p class="auth-copy">© <span data-year></span> SkyGlass</p>
  </main>
</body>
</html>
